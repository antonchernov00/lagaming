  { sec:"Запреты", q:"Зависит ли уголовная ответственность за хищение от того, оформлен сотрудник официально или нет?", options:["Да, неоформленных нельзя привлечь", "Нет, не зависит от формы оформления отношений", "Зависит только для новых сотрудников"], correct:1 },

  { sec:"Оплата труда", q:"Когда выплачивается оклад администраторам на Ленина и Мира?", options:["Каждую пятницу", "15 числа месяца", "В конце месяца"], correct:1 },
  { sec:"Оплата труда", q:"Когда выплачивается процент от бара на Ленина и Мира?", options:["15 числа месяца", "31 числа месяца", "Каждое воскресенье"], correct:1 },

  { sec:"Оплата труда", q:"Когда выплачивается процент от бара на 50 лет ВЛКСМ?", options:["Каждое воскресенье", "Каждое второе воскресенье месяца", "31 числа"], correct:1 },


  { sec:"Мотивация", q:"Какая сумма ежемесячной премии за отсутствие нарушений?", options:["500 ₽", "2 500 ₽", "5 000 ₽"], correct:1 },
  { sec:"Мотивация", q:"Что нужно, чтобы получить ежемесячную премию за чистоту?", options:["Не более одного нарушения за месяц", "Ноль нарушений за календарный месяц", "Не более трёх штрафов за месяц"], correct:1 },

  { sec:"Академия — Матчасть", q:"Что в первую очередь определяет, потянет ли компьютер конкретную игру?", options:["Видеокарта (GPU)", "Процессор (CPU)", "Оперативная память"], correct:0 },
  { sec:"Академия — Матчасть", q:"За что отвечает процессор (CPU), если не за саму картинку?", options:["За звук в игре", "За логику игры: физику, ИИ, загрузку уровней", "За частоту обновления монитора"], correct:1 },
  { sec:"Академия — Матчасть", q:"Гость жалуется на подвисания в Rust при открытых Discord и браузере. Что проверить в первую очередь?", options:["Частоту монитора (Гц)", "Объём оперативной памяти", "Цвет корпуса ПК"], correct:1 },
  { sec:"Академия — Матчасть", q:"Почему Rust и Tarkov требовательны именно к оперативной памяти?", options:["Там сложная графика", "Много игроков и объектов обрабатывается одновременно", "Игры плохо оптимизированы"], correct:1 },
  { sec:"Академия — Матчасть", q:"Что даёт более высокая частота монитора (Гц) в соревновательных играх?", options:["Более яркие цвета", "Более плавное и точное отображение движения", "Больше места на экране"], correct:1 },
  { sec:"Академия — Продажи", q:"В каком порядке лучше предлагать тарифы гостю?", options:["С самого дешёвого, постепенно поднимая", "С самого дорогого, дешевле — по запросу", "Порядок не имеет значения"], correct:1 },

  { sec:"Академия — Продажи", q:"Гость второй раз отказался от допродажи. Как правильно поступить?", options:["Настойчиво предложить ещё раз с другой стороны", "Не давить — постоянный гость важнее разовой продажи", "Предложить руководителю надавить на гостя"], correct:1 },

  { sec:"Академия — Сложные ситуации", q:"В каком случае нужно звать старшего/управляющего сразу, не дожидаясь стандартных предупреждений?", options:["Гость громко разговаривает по телефону", "Угроза, физическая агрессия или вопрос денег вне полномочий администратора", "Гость просит пересадить его за другой стол"], correct:1 },
  { sec:"Академия — Сложные ситуации", q:"Что стоит сделать после сложного конфликта с гостем, прежде чем обслуживать следующего?", options:["Сразу забыть и переходить к следующему без паузы", "Сделать паузу и не переносить раздражение на следующего гостя", "Обсудить ситуацию вслух с другими гостями"], correct:1 },
  { sec:"Академия — Жанры", q:"К какому жанру относится Dota 2?", options:["Шутер", "MOBA", "Батл-рояль"], correct:1 },
  { sec:"Академия — Жанры", q:"Какой жанр обычно самый требовательный к процессору и памяти из-за большого числа игроков на карте?", options:["MOBA", "Survival (Rust, Tarkov)", "Шутер"], correct:1 },
  { sec:"Академия — Матчасть", q:"Как правильно объяснять гостю разницу между залами по характеристикам?", options:["Сразу называть цифры Гц и модель видеокарты", "Сначала простыми словами объяснить выгоду, характеристики — если гость сам спросит", "Не объяснять вообще, гость должен разобраться сам"], correct:1 },
];

function sanitizeKey(name) { return name.trim().toLowerCase().replace(/[\s\/\\'"]+/g, "-").slice(0, 60); }

function Landing({ name, setName, onStart }) {
  return (
    <div className="shell">
      <div className="card">
        <p className="eyebrow">Проверка знаний</p>
        <h2 className="sec-title display">{QUESTIONS.length} вопросов по всей должностной инструкции</h2>
        <p className="body-text">Перед этим стоит внимательно прочитать инструкцию целиком — здесь только проверка, без материала для изучения.</p>
        <p className="body-text">Вопросы построены на конкретных деталях, а не на общих представлениях о сервисе — угадать интуитивно сложно, если инструкцию не читал по-настоящему. Порог прохождения — 80%.</p>
        <input className="name-input" placeholder="Как тебя зовут?" value={name} onChange={e => setName(e.target.value)} />
        <button className="btn" disabled={!name.trim()} onClick={onStart}>Начать проверку</button>
      </div>
    </div>
  );
}

function TestView({ name, onFinish }) {
  const [answers, setAnswers] = useState({});
  const select = (qi, oi) => setAnswers(prev => ({ ...prev, [qi]: oi }));
  const allAnswered = Object.keys(answers).length === QUESTIONS.length;
  const answeredCount = Object.keys(answers).length;

  return (
    <div className="shell">
      <div className="progress-fixed">
        <div className="meter-row" style={{marginTop:0}}>
          <div className="meter-track"><div className="meter-fill" style={{width: (answeredCount/QUESTIONS.length*100) + "%"}}></div></div>
          <div className="meter-label" style={{color:"var(--navy)"}}>{answeredCount}/{QUESTIONS.length}</div>
        </div>
      </div>
      <div className="card">
        {QUESTIONS.map((item, qi) => (
          <div className="q-block" key={qi}>
            <div className="q-num">{item.sec.toUpperCase()} · ВОПРОС {qi+1}</div>
            <p className="q-text">{item.q}</p>
            {item.options.map((opt, oi) => (
              <button key={oi} className={"opt" + (answers[qi] === oi ? " selected" : "")} onClick={() => select(qi, oi)}>{opt}</button>
            ))}
          </div>
        ))}
        <button className="btn" disabled={!allAnswered} onClick={() => onFinish(answers)}>Сдать проверку</button>
      </div>
    </div>
  );
}

function ResultsView({ answers, name, onRestart }) {
  const total = QUESTIONS.length;
  const correct = QUESTIONS.filter((q, qi) => answers[qi] === q.correct).length;
  const score = correct / total;
  const passed = score >= 0.8;
  const today = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });

  return (
    <div className="shell">
      <div className="card score-hero">
        <span className={"badge" + (passed ? "" : " fail")}>{passed ? "Пройдено" : "Не пройдено"}</span>
        <div className="score-num">{correct}/{total}</div>
        <div className="score-den">{Math.round(score*100)}% правильных ответов, порог — 80%</div>
      </div>
      {passed ? (
        <div className="card" style={{border:"2px solid var(--ok)", background:"#F5FBF7"}}>
          <p className="eyebrow" style={{color:"var(--ok)"}}>Покажи этот экран управляющему</p>
          <h2 className="sec-title display">Подтверждение прохождения</h2>
          <div style={{fontSize:15.5, marginBottom:10}}><strong>Сотрудник:</strong> {name}</div>
          <div style={{fontSize:15.5, marginBottom:10}}><strong>Дата:</strong> {today}</div>
          <div style={{fontSize:15.5}}><strong>Результат:</strong> {correct}/{total} ({Math.round(score*100)}%)</div>
          <p className="body-text" style={{marginTop:16}}>Сфотографируй этот экран и отправь управляющему.</p>
        </div>
      ) : (
        <div className="card">
          <div className="fail-msg">
            Результат ниже порога в 80%. Прежде чем пробовать снова — изучи должностную инструкцию заново, целиком, а не только те места, где сомневался. Открой сайт с инструкцией (файл «instrukciya_sayt.html», если он рядом с этим) и пройди по всем разделам ещё раз.
          </div>
          <button className="btn btn-navy" onClick={onRestart}>Пройти проверку заново</button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("landing");
  const [name, setName] = useState("");
  const [finalAnswers, setFinalAnswers] = useState({});

  return (
    <>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand"><div className="brand-dot"></div><div className="brand-name">L.A.Gaming</div></div>
          <h1 className="h1 display">Проверка знаний</h1>
          <p className="sub">{name ? `Сдаёт: ${name}` : "Допуск к стажировке"}</p>
        </div>
      </div>
      {view === "landing" && <Landing name={name} setName={setName} onStart={() => setView("test")} />}
      {view === "test" && <TestView name={name} onFinish={(a) => { setFinalAnswers(a); setView("results"); }} />}
      {view === "results" && <ResultsView answers={finalAnswers} name={name} onRestart={() => { setFinalAnswers({}); setView("test"); }} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
